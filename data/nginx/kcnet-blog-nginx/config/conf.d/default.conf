server {
    listen 0.0.0.0:80;
    root /var/www/html;

    # This adds the Cloudflare IPs and the CF-Connecting-IP header.
    # This is required for proper IP logging behind Cloudflare.
    include /etc/nginx/cloudflare.conf;

    location / {
        index index.php index.html index.htm;
    }

    # New for custom error pages
    # https://www.digitalocean.com/community/tutorials/how-to-configure-nginx-to-use-custom-error-pages-on-ubuntu-14-04
    error_page 403 /error_pages/custom_403.html;
    error_page 404 /404.html;
    # location = /custom_404.html {
        
    # }

    #------------
    # Enable some extra caching and compression to ease the load on the VPS.
    # https://vps.do/how-to-host-a-static-website-on-a-vps-with-nginx-hugo-jekyll-next-js/

    # I dropped this down to 30 days instead of a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        # expires 1y;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Short cache for HTML (so updates propagate quickly)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Compress some files with GZip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;
    #--------


    # PHP for somethings, I may disable this in the future if it's not needed in here.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php_kcnet-blog:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
    #-----------
}
